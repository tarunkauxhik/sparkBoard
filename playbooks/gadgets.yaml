# Gadget look. The LLM adapts these to the brand and logs why.
mood: calm confidence, quiet focus
tone: precise and understated, few words
setting: a clean desk or dark matte surface with one or two real objects
camera: locked-off or slow slider moves, macro details
lens: 85 mm or macro, shallow depth of field
light: one hard key light with a soft edge, deep shadows
palette: near-black and graphite with one cool accent
pacing: slow, deliberate, cuts every 4 seconds
