# Fashion look. The LLM adapts these to the brand and logs why.
mood: easy confidence, movement
tone: playful, shown more than said
setting: a city street or plain studio wall in daylight
camera: handheld following shots and full-length frames
lens: 35 mm, full body with room to move
light: open shade or soft overcast daylight
palette: muted background so the clothes carry the color
pacing: rhythmic, cuts every 2-4 seconds
